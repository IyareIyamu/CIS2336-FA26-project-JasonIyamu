<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">

        <section class="multimedia-section">

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/kInDUV7JLlk"
                        title="UH Student Center Media Presentation"
                        allowfullscreen></iframe>

        <!-- Mandatory Developer Contact Section -->
        <section class="developer-contact">
            <h2>Developer Contact</h2>
            <p><strong>Name:</strong> Jason Iyamu</p>
            <p><strong>Email:</strong> <a href="mailto:ijiyamu@cougarnet.uh.edu">ijiyamu@cougarnet.uh.edu</a></p>

    </main>

    <footer>
        <p>&copy; 2026 University of Houston Sugar Land. All rights reserved.</p>
    </footer>

    <!-- Client-side script execution -->
    <script src="script.js"></script>
