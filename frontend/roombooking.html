<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking - UH Sugar Land Student Center</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <section>
            <h1>Reserve a Study Space</h1>
            <p>Fill out the form below to request a reservation for one of our 5 student center study rooms.</p>

            <!-- Room Booking Submission Interface -->
            <form id="booking-form" action="/api/book" method="POST" novalidate>
                <div class="form-group">
    <label for="student-name">Full Name</label>
    <input type="text" id="student-name" name="studentName" required>
    <span class="error-message"></span>
</div>

<div class="form-group">
    <label for="student-id">PeopleSoft ID (7 Digits)</label>
    <input type="text" id="student-id" name="studentId" pattern="\d{7}" required>
    <span class="error-message"></span>
</div>

<div class="form-group">
    <label for="room-select">Select a Room</label>
    <select id="room-select" name="roomSelection" required>
        <option value="">-- Choose a Space --</option>
        <option value="Room 101">Room 101 (Quiet Study)</option>
        <option value="Room 102">Room 102 (Group Collaboration)</option>
        <option value="Room 103">Room 103 (Presentation Practice)</option>
        <option value="Room 104">Room 104 (Tech Lounge Room)</option>
        <option value="Room 105">Room 105 (Conference Suite)</option>
    </select>
    <span class="error-message"></span>
</div>

<div class="form-group">
    <label for="booking-date">Reservation Date</label>
    <input type="date" id="booking-date" name="bookingDate" required>
    <span class="error-message"></span>
</div>
                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 University of Houston Sugar Land. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
